[project]
name = "tiny-amazon-wrapper"
version = "1.0.0"
description = "Tiny Amazon ec2 Wrapper — a simplified command-line interface for Amazon EC2, S3, and Route 53"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Masahiro Kasahara" }]
requires-python = ">=3.10"
keywords = ["aws", "ec2", "s3", "route53", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.20",
    "click>=8",
    "colorama>=0.4.6",
    "dnspython>=2.0",
    "ipython>=8",
    "pyperclip>=1.8",
    "tabulate>=0.9",
    "termcolor>=2",
]

[project.scripts]
taw = "taw.main:main"

[project.urls]
Homepage = "https://github.com/mkasa/taw"

[project.optional-dependencies]
# `aws configure` is no longer bundled; install awscli separately if you need it
# (e.g. `uv tool install awscli` or `brew install awscli`).
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taw"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
# Keep pyflakes (unused imports/vars) plus invalid-escape detection, but don't
# fight the project's established idioms: `from taw.taw import *` is how commands
# register (F403/F405), and semicolon/one-line imports are used deliberately.
extend-select = ["W605"]
ignore = [
    "E401",  # multiple imports on one line — used throughout
    "E402",  # module import not at top — `from taw.taw import *` must be last
    "E701",  # multiple statements (colon)
    "E702",  # multiple statements (semicolon) — deliberate style
    "E722",  # bare `except:` — pervasive defensive style
    "E741",  # ambiguous variable name (e.g. `l`)
    "F403",  # star import — required for command registration
    "F405",  # name may be undefined from star import
]
